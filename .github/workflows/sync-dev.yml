name: Sync origin dev

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure origin
        run: |
          git remote set-url origin https://github.com/AI20K-Build-Phase-Cohort-3/P-141.git
          git remote set-url --push origin https://github.com/tuananhpham-vnu/VmedTriage_MicroGenius.git
          git remote -v

      - name: Sync dev
        run: |
          git fetch origin dev
          git checkout dev
          git reset --hard
          git clean -fd
          git push origin dev --force