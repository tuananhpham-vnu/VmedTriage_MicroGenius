services:
  - type: web
    name: vmedtriage
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_PROVIDER_ORDER
        value: deepseek,gemini
      - key: OPENAI_MODEL_NAME
        value: gpt-4o-mini
      - key: DEEPSEEK_MODEL_NAME
        value: deepseek-chat
      - key: GEMINI_MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: SUPPORTED_MODEL_NAME
        value: Qwen/Qwen3-8B
      - key: LLM_TEMPERATURE
        value: "0.0"
