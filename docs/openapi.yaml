openapi: 3.1.0
info:
  title: VMedTriage
  description: Controlled medical triage support pipeline with mandatory human approval
  version: 1.0.0
paths:
  /api/v1/register:
    post:
      summary: Register
      description: Create a patient account, or a nurse account with the private registration
        code.
      operationId: register_api_v1_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/login:
    post:
      summary: Login
      description: Authenticate an account and issue a short-lived JWT access token.
      operationId: login_api_v1_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/register:
    post:
      summary: Register Alias
      description: 'Alias của POST /register theo đặc tả Feature #3 (POST /auth/register).
        Giữ /register để tương thích ngược.'
      operationId: register_alias_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      summary: Login Alias
      description: 'Alias của POST /login theo đặc tả Feature #3 (POST /auth/login).
        Giữ /login để tương thích ngược.'
      operationId: login_alias_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/email-verification/confirm:
    post:
      summary: Confirm Email Verification
      operationId: confirm_email_verification_api_v1_auth_email_verification_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/email-verification/resend:
    post:
      summary: Resend Email Verification
      operationId: resend_email_verification_api_v1_auth_email_verification_resend_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/password-reset/request:
    post:
      summary: Request Password Reset
      operationId: request_password_reset_api_v1_auth_password_reset_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Confirm Password Reset
      operationId: confirm_password_reset_api_v1_auth_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/change-password:
    post:
      summary: Change Password
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      summary: Current User
      description: Return the user represented by the validated Bearer token.
      operationId: current_user_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/v1/chat:
    post:
      summary: Chat
      description: Receive a patient message and run the controlled triage pipeline.
      operationId: chat_api_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/status:
    get:
      summary: Agent Status
      description: Check VMedTriage agent status.
      operationId: agent_status_api_v1_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/tools:
    get:
      summary: List Tools
      description: List configured MCP tool descriptors.
      operationId: list_tools_api_v1_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MCPToolDescriptor'
                type: array
                title: Response List Tools Api V1 Tools Get
  /api/v1/tools/{tool_name}/call:
    post:
      summary: Call Tool
      description: Call an external MCP tool through the registry.
      operationId: call_tool_api_v1_tools__tool_name__call_post
      parameters:
      - name: tool_name
        in: path
        required: true
        schema:
          type: string
          title: Tool Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPToolCallRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPToolCallResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nurse/queue:
    get:
      summary: Nurse Queue
      description: List triage cases visible to the nurse dashboard.
      operationId: nurse_queue_api_v1_nurse_queue_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TriageCase'
                type: array
                title: Response Nurse Queue Api V1 Nurse Queue Get
  /api/v1/cases/{case_id}:
    get:
      summary: Get Case
      operationId: get_case_api_v1_cases__case_id__get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageCase'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/review:
    post:
      summary: Review Case
      operationId: review_case_api_v1_cases__case_id__review_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NurseReviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseReviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases:
    post:
      tags:
      - Feature 1 - AI Agent khai thác triệu chứng
      summary: Create Case
      description: Bệnh nhân gửi tin nhắn tự do đầu tiên để tạo case mới. Agent detect
        nhóm triệu chứng ngay.
      operationId: create_case_api_v1_cases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMessageRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseInteractionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/responses:
    post:
      tags:
      - Feature 1 - AI Agent khai thác triệu chứng
      summary: Continue Case
      description: Bệnh nhân gửi tin nhắn tự do tiếp theo trong hội thoại đã có.
      operationId: continue_case_api_v1_cases__case_id__responses_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseInteractionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/queue:
    get:
      tags:
      - Feature 2 - Hàng đợi & Duyệt ca (HITL)
      summary: Get Queue
      description: Danh sách case chờ duyệt, sắp theo priority (Cấp cứu trước) rồi
        theo thời gian chờ.
      operationId: get_queue_api_v1_queue_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/QueueItemView'
                type: array
                title: Response Get Queue Api V1 Queue Get
  /api/v1/cases/{case_id}/approve:
    post:
      tags:
      - Feature 2 - Hàng đợi & Duyệt ca (HITL)
      summary: Approve Case
      description: Giữ nguyên đề xuất AI làm final_priority.
      operationId: approve_case_api_v1_cases__case_id__approve_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/override:
    post:
      tags:
      - Feature 2 - Hàng đợi & Duyệt ca (HITL)
      summary: Override Case
      description: Điều dưỡng đổi mức ưu tiên khác với đề xuất AI (ghi log giá trị
        cũ/mới).
      operationId: override_case_api_v1_cases__case_id__override_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/escalate:
    post:
      tags:
      - Feature 2 - Hàng đợi & Duyệt ca (HITL)
      summary: Escalate Case
      description: Luôn đặt final_priority = Cấp cứu (mức cao nhất) bất kể AI đề xuất
        gì.
      operationId: escalate_case_api_v1_cases__case_id__escalate_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/reject:
    post:
      tags:
      - Feature 2 - Hàng đợi & Duyệt ca (HITL)
      summary: Reject Case
      description: 'Từ chối xử lý case (vd: đã xử lý offline). reason_code bắt buộc
        để tách khỏi thống kê accuracy.'
      operationId: reject_case_api_v1_cases__case_id__reject_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/ask_more:
    post:
      tags:
      - Feature 2 - Hàng đợi & Duyệt ca (HITL)
      summary: Ask More Case
      description: Yêu cầu thêm thông tin trước khi quyết định - case quay lại hội
        thoại với câu hỏi của điều dưỡng.
      operationId: ask_more_case_api_v1_cases__case_id__ask_more_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskMoreRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/disclaimer:
    get:
      tags:
      - Feature 4 - Disclaimer & Kết quả cho bệnh nhân
      summary: Get Disclaimer
      description: Nội dung disclaimer tĩnh - công cụ không thay thế bác sĩ.
      operationId: get_disclaimer_api_v1_disclaimer_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclaimerResponse'
  /api/v1/cases/{case_id}/result:
    get:
      tags:
      - Feature 4 - Disclaimer & Kết quả cho bệnh nhân
      summary: Get Case Result
      description: Patient-only, kiểm tra ownership. Chỉ trả nội dung xử trí chi tiết
        khi đã được duyệt.
      operationId: get_case_result_api_v1_cases__case_id__result_get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake/health:
    get:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: Intake Health
      description: Cho biết demo đang chạy bằng LLM thật hay fallback, và provider
        nào đang khả dụng.
      operationId: intake_health_api_v1_intake_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Intake Health Api V1 Intake Health Get
  /api/v1/intake/providers:
    get:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: List Providers
      description: Danh sách provider + model gợi ý để UI render dropdown chọn LLM.
      operationId: list_providers_api_v1_intake_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Providers Api V1 Intake Providers Get
  /api/v1/intake/providers/test:
    post:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: Test Credential
      description: Gọi thử một request rất ngắn để người test biết key/model của họ
        có dùng được không.
      operationId: test_credential_api_v1_intake_providers_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeCredentialRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Test Credential Api V1 Intake Providers Test Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake/sessions:
    post:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: Create Session
      description: 'Bắt đầu phiên hỏi-đáp mới, trả về câu hỏi mở đầu.


        Body tuỳ chọn: `{"provider": "deepseek", "api_key": "...", "model": "deepseek-chat"}`
        để dùng

        key riêng của người test cho cả phiên.'
      operationId: create_session_api_v1_intake_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/IntakeCredentialRequest'
              - type: 'null'
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake/sessions/{session_id}:
    get:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: Get Session
      operationId: get_session_api_v1_intake_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake/sessions/{session_id}/messages:
    post:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: Send Message
      description: Gửi câu trả lời; agent trích xuất checklist và hỏi tiếp, hoặc chuyển
        sang phiếu tóm tắt.
      operationId: send_message_api_v1_intake_sessions__session_id__messages_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake/sessions/{session_id}/confirm:
    post:
      tags:
      - Demo - Hỏi đáp thu thập triệu chứng
      summary: Confirm
      description: Người bệnh xác nhận phiếu tóm tắt đúng/chưa đúng (kèm nội dung
        cần sửa).
      operationId: confirm_api_v1_intake_sessions__session_id__confirm_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ActorRole:
      type: string
      enum:
      - patient
      - nurse
      - system
      title: ActorRole
    ApprovalActionResponse:
      properties:
        case_id:
