        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - access_token
      - expires_in
      - user
      title: TokenResponse
    ToolCallPolicy:
      properties:
        risk_level:
          $ref: '#/components/schemas/ToolRiskLevel'
        requires_human_approval:
          type: boolean
          title: Requires Human Approval
          default: true
        patient_visible:
          type: boolean
          title: Patient Visible
          default: false
        allow_before_hitl:
          type: boolean
          title: Allow Before Hitl
          default: false
      type: object
      required:
      - risk_level
      title: ToolCallPolicy
    ToolRiskLevel:
      type: string
      enum:
      - read_only
      - clinical_decision_support
      - side_effect
      title: ToolRiskLevel
    TriageCase:
      properties:
        case_id:
          type: string
          title: Case Id
        conversation:
          items:
            $ref: '#/components/schemas/ConversationMessage'
          type: array
          title: Conversation
        structured_data:
          anyOf:
          - $ref: '#/components/schemas/StructuredSymptomData'
          - type: 'null'
        validation:
          anyOf:
          - $ref: '#/components/schemas/ValidationResult'
          - type: 'null'
        red_flags:
          items:
            $ref: '#/components/schemas/RedFlagFinding'
          type: array
          title: Red Flags
        triage_proposal:
          anyOf:
          - $ref: '#/components/schemas/TriageProposal'
          - type: 'null'
        summary:
          anyOf:
          - $ref: '#/components/schemas/HandoffSummary'
          - type: 'null'
        queue_item:
          anyOf:
          - $ref: '#/components/schemas/NurseQueueItem'
          - type: 'null'
        status:
          $ref: '#/components/schemas/CaseStatus'
          default: collecting_information
        patient_visible_response:
          anyOf:
          - type: string
          - type: 'null'
          title: Patient Visible Response
        patient_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Patient Id
          description: Chủ sở hữu case (id bệnh nhân đã đăng nhập)
        created_at:
          type: string
          format: date-time
          title: Created At
        field_ask_counts:
          additionalProperties:
            type: integer
          type: object
          title: Field Ask Counts
        next_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Message
          description: Câu hỏi/phản hồi tiếp theo của agent, null nếu đã đủ thông
            tin
        summary_ready:
          type: boolean
          title: Summary Ready
          default: false
        summary_fields:
          items:
            $ref: '#/components/schemas/SummaryField'
          type: array
          title: Summary Fields
        quality_flag:
          $ref: '#/components/schemas/ConversationQualityFlag'
          description: Gán bởi quality_guard mỗi turn; low_quality chỉ dùng để suppress
            hàng đợi khi KHÔNG có red-flag.
          default: normal
      type: object
      title: TriageCase
    TriagePriority:
      type: string
      enum:
      - Emergency
      - Urgent
      - Routine
      - Self-care
      - Manual review
      title: TriagePriority
    TriageProposal:
      properties:
        priority:
          $ref: '#/components/schemas/TriagePriority'
        protocol_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Protocol Id
        reason:
          type: string
          title: Reason
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 0.0
        requires_manual_review:
          type: boolean
          title: Requires Manual Review
          default: true
        detect_source:
          type: string
          title: Detect Source
          description: Nguồn dùng để phát hiện/gợi ý triệu chứng (mô phỏng nội bộ,
            KHÔNG dùng để kết luận mức độ ưu tiên).
          default: ''
        grounding_source:
          type: string
          title: Grounding Source
          description: Nguồn dùng để 'ground' kết luận mức độ ưu tiên (mô phỏng nội
            bộ theo Bộ Y tế VN/WHO).
          default: ''
      type: object
      required:
      - priority
      - reason
      title: TriageProposal
